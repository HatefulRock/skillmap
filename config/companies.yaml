# Company job boards read every day. `ats` + `token` is the board's id in its public API
# (e.g. boards-api.greenhouse.io/v1/boards/<token>/jobs). `sector` labels every posting from
# that board. Seeded from the census thread's target list (target_companies.csv) plus
# well-known AI, crypto and fintech employers. A board that 404s is reported in the run
# summary rather than failing the run, so dead tokens are easy to spot and prune.
