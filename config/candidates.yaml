# Companies to look for on the public job-board platforms (Greenhouse, Lever, Ashby, Workable,
# SmartRecruiters), on top of every active Y Combinator company that is hiring. `skillmap discover`
# tries board names derived from each name (and `tokens` when given), keeps every board that
# answers with open jobs, and writes the result to config/boards.yaml.
#
# Grouped by the sector label their postings get. Add a name here to widen the census; a
# company whose careers site isn't on one of those platforms (Workday, in-house) simply isn't
# found, which is reported in the discovery summary.

