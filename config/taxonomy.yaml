# Skill taxonomy. Canonical names and categories match the census spreadsheet's
# skill_taxonomy.json so both report the same skills; the patterns here are written for full
# posting text rather than short skill lists, so they need word boundaries and context.
#
#   patterns: case-insensitive regexes
#   cs:       case-sensitive regexes (for short or ambiguous names like Go, R, MCP)
#   not:      if any of these match the same sentence, that sentence doesn't count
#
# Bump `version` whenever a pattern (or any other extractor, e.g. salary) changes: stored
# postings are re-extracted on the next run.
version: 9  # v9: security, identity, networking, DevOps/SRE, mobile, BI, Windows and virtualisation skills; bare CI, GitOps and GitLab. v2: salary from text. v3: ad length, years, unknown terms, degree, visa, equity. v4: no benefits/monitoring false positives. v5: seniority (bank grades, solutions architects), non-software engineering, pre-sales, more countries. v6: no shouted-heading words as unknown terms. v8: trading desk, ops and product roles as their own group. v7: soft skills (own section); quant roles need a quant or trading-tech title (no PMs, quantum, trading ops); risk modelling split from KYC/AML

skills:
  # ---------- Languages ----------
  Python:
    category: Languages
    patterns: ['\bpython\b', '\bpyspark\b', '\bpydantic\b']
  TypeScript:
    category: Languages
    patterns: ['\btypescript\b']
  JavaScript / Node.js:
    category: Languages
    patterns: ['\bjavascript\b', '\bnode\.?js\b', '\bnodejs\b', '\becmascript\b']
  Java / Kotlin (Spring):
    category: Languages
    patterns: ['\bjava\b(?!\s*script)', '\bkotlin\b', '\bspring ?boot\b', '\bspring framework\b']
  Go:
    category: Languages
    patterns: ['\bgolang\b']
    cs: ['\bGo\b(?=\s*(?:,|/|\)|and\b|or\b|developer|engineer|programming|services|microservices|backend))', '(?:,|/|\(|\band|\bor|\bin)\s+Go\b(?!\s+(?:to|live|beyond|above|from|through|deep|ahead|out|back)\b)']
  C++ / C#:
    category: Languages
    patterns: ['(?<![\w])c\+\+(?![\w])', '(?<![\w])c#(?![\w])', '\.net\b']
  Rust / Scala:
    category: Languages
    patterns: ['\brust\b(?!\s*belt)', '\bscala\b']
  SQL:
    category: Languages
    patterns: ['\bsql\b', '\bpostgres(?:ql)?\b', '\bmysql\b', '\bt-sql\b', '\bsnowflake\b', '\bbigquery\b']

  # ---------- LLM & agents ----------
  LLMs / GenAI (general):
    category: LLM & agents
    patterns: ['\bllms?\b', '\blarge language models?\b', '\bgen ?ai\b', '\bgenerative ai\b', '\bfoundation models?\b']
  RAG:
    category: LLM & agents
    patterns: ['\brag\b', '\bretrieval[- ]augmented\b', '\bgraph ?rag\b']
  AI agents / agentic workflows:
    category: LLM & agents
    patterns: ['\bagentic\b', '\bai agents?\b', '\bllm agents?\b', '\bautonomous agents?\b', '\bagent (?:frameworks?|systems?|workflows?|orchestration|development)\b', '\bbuild(?:ing)? agents\b']
  Multi-agent systems:
    category: LLM & agents
    patterns: ['\bmulti[- ]agent\b']
  Tool / function calling:
    category: LLM & agents
    patterns: ['\btool[- ]?(?:calling|use)\b', '\bfunction[- ]calling\b']
  Prompt & context engineering:
    category: LLM & agents
    patterns: ['\bprompt (?:engineering|design|optimi[sz]ation|tuning)\b', '\bcontext engineering\b', '\bprompting\b', '\bfew[- ]shot\b', '\bchain[- ]of[- ]thought\b']
  Structured output:
    category: LLM & agents
    patterns: ['\bstructured outputs?\b', '\bjson mode\b', '\bconstrained decoding\b']
  Workflow orchestration:
    category: LLM & agents
    patterns: ['\b(?:airflow|dagster|prefect|argo workflows)\b', '\bworkflow orchestration\b']
  MCP:
    category: LLM & agents
    patterns: ['\bmodel context protocol\b']
    cs: ['\bMCP\b']
  Agent memory:
    category: LLM & agents
    patterns: ['\bagent memory\b', '\blong[- ]term memory\b', '\bmemory (?:systems|architecture|layer) for (?:ai|llm|agents?)\b']

  # ---------- Frameworks ----------
  LangChain:
    category: Frameworks
    patterns: ['\blangchain\b']
  LangGraph:
    category: Frameworks
    patterns: ['\blanggraph\b']
  LlamaIndex:
    category: Frameworks
    patterns: ['\bllama ?index\b']
  CrewAI / AutoGen / other agent SDKs:
    category: Frameworks
    patterns: ['\bcrew ?ai\b', '\bautogen\b', '\bsemantic kernel\b', '\bagents sdk\b', '\bpydantic ?ai\b', '\bdspy\b', '\bsmolagents\b']
  LLM provider APIs (OpenAI / Anthropic / Gemini):
    category: Frameworks
    patterns: ['\bopenai\b', '\banthropic\b', '\bclaude\b', '\bgemini\b(?! exchange)', '\bgpt-?\d', '\bchatgpt\b', '\bmistral\b', '\bllama ?\d', '\bbedrock\b', '\bcohere\b']
  Hugging Face Transformers:
    category: ML
    patterns: ['\bhugging ?face\b', '\btransformers library\b']

  # ---------- Retrieval & data ----------
  Vector databases:
    category: Retrieval & data
    patterns: ['\bvector (?:databases?|db|stores?|search)\b', '\bpinecone\b', '\bweaviate\b', '\bqdrant\b', '\bmilvus\b', '\bchroma(?:db)?\b', '\bpgvector\b', '\bfaiss\b']
  Embeddings / semantic search:
    category: Retrieval & data
    patterns: ['\bembeddings?\b', '\bsemantic search\b', '\bdense retrieval\b']
  Hybrid search / reranking / chunking:
    category: Retrieval & data
    patterns: ['\bre-?rank(?:ing|ers?)?\b', '\bhybrid search\b', '\bchunking\b', '\bbm25\b']
  Knowledge graphs / GraphRAG:
    category: Retrieval & data
    patterns: ['\bknowledge graphs?\b', '\bgraph ?rag\b', '\bneo4j\b', '\bgraph databases?\b']
  PostgreSQL / relational DBs:
    category: Retrieval & data
    patterns: ['\bpostgres(?:ql)?\b', '\bmysql\b', '\brelational databases?\b', '\brdbms\b', '\boracle db\b', '\bsql server\b']
  NoSQL (MongoDB, DynamoDB):
    category: Retrieval & data
    patterns: ['\bnosql\b', '\bmongo(?:db)?\b', '\bdynamodb\b', '\bcassandra\b', '\bcouchbase\b', '\belasticsearch\b', '\bopensearch\b']
  Redis / caching:
    category: Retrieval & data
    patterns: ['\bredis\b', '\bmemcached\b', '\bcaching\b']
  Kafka / message queues / streaming:
    category: Retrieval & data
    patterns: ['\bkafka\b', '\brabbitmq\b', '\bpub/?sub\b', '\bkinesis\b', '\bmessage (?:queues?|brokers?)\b', '\bevent[- ]driven\b', '\bstream processing\b', '\bflink\b']
  BI / dashboards (Power BI, Tableau, Looker):
    category: Retrieval & data
    patterns: ['\bpower ?bi\b', '\btableau\b', '\blooker\b', '\bbusiness intelligence\b', '\bmetabase\b', '\bqlik\w*', '\bsuperset\b(?=\s*(?:,|/|\)|dashboards?))']
    cs: ['\bBI\b(?!-)']
  Spark / big data:
    category: Retrieval & data
    patterns: ['\bapache spark\b', '\bpyspark\b', '\bspark\b(?=\s*(?:,|/|\)|sql|streaming|jobs?|clusters?))', '\bhadoop\b', '\bdatabricks\b', '\bbig data\b', '\bhive\b(?=\s*(?:,|/|\)|sql|tables?))']
  Data pipelines / ETL:
    category: Retrieval & data
    patterns: ['\betl\b', '\belt\b(?= pipelines?)', '\bdata pipelines?\b', '\bdbt\b', '\bdata ingestion\b']

  # ---------- Eval, safety & observability ----------
  LLM evaluation / eval harnesses:
    category: Eval, safety & observability
    patterns: ['\bevals\b', '\b(?:llm|model|ai|offline|online) evaluations?\b', '\bevaluation (?:frameworks?|harness(?:es)?|pipelines?|sets?|datasets?)\b', '\bllm[- ]as[- ]a?[- ]?judge\b', '\bragas\b', '\bdeepeval\b', '\bbenchmarks?\b']
  Guardrails / AI safety:
    category: Eval, safety & observability
    patterns: ['\bguardrails?\b', '\bai safety\b', '\bresponsible ai\b', '\bred[- ]teaming\b', '\balignment\b(?=.{0,40}(?:model|ai|llm))', '\bhallucinations?\b']
  LLM security (prompt injection, OWASP LLM):
    category: Eval, safety & observability
    patterns: ['\bprompt injections?\b', '\bjailbreaks?\b', '\bowasp (?:top 10 )?(?:for )?llm\b', '\bai security\b', '\bllm security\b']
  Observability / tracing / monitoring:
    category: Eval, safety & observability
    # Bare "monitoring" also matched transaction, patient and brand monitoring.
    patterns: ['\bobservability\b', '\bopentelemetry\b', '\bprometheus\b', '\bgrafana\b', '\bdatadog\b', '\bdistributed tracing\b',
               '\bsplunk\b', '\bnew relic\b',
               '\b(?:application|systems?|infrastructure|production|performance|service|server|network|cloud|model) monitoring\b',
               '\bmonitoring(?:,| and| &| /|/) ?(?:alerting|logging|observability|tracing)\b',
               '\b(?:logging|alerting)(?:,| and| &| /|/) ?monitoring\b', '\bmonitoring (?:tools?|systems?|stack|dashboards?)\b']
  LLM tracing tools (Langfuse / LangSmith / Arize):
    category: Eval, safety & observability
    patterns: ['\blangfuse\b', '\blangsmith\b', '\barize\b', '\bphoenix\b(?= (?:tracing|arize))', '\bweights (?:&|and) biases\b', '\bwandb\b', '\bhelicone\b', '\bbraintrust\b']
  Cost / latency optimization:
    category: Eval, safety & observability
    patterns: ['\blatency (?:optimi[sz]ation|reduction|budgets?)\b', '\bcost (?:optimi[sz]ation|efficiency|reduction)\b', '\blow[- ]latency\b']
  Governance / compliance / audit:
    category: Eval, safety & observability
    patterns: ['\bai governance\b', '\bmodel governance\b', '\bmodel risk\b', '\baudit trails?\b', '\bdata governance\b', '\bgdpr\b', '\bsoc ?2\b', '\biso ?27001\b']

  # ---------- ML ----------
  PyTorch:
    category: ML
    patterns: ['\bpytorch\b', '\btorch\b']
  TensorFlow / Keras / JAX:
    category: ML
    patterns: ['\btensorflow\b', '\bkeras\b', '\bjax\b']
  scikit-learn / classical ML:
    category: ML
    patterns: ['\bscikit[- ]learn\b', '\bsklearn\b', '\bxgboost\b', '\blightgbm\b', '\bcatboost\b', '\bgradient boost(?:ing|ed)\b', '\brandom forests?\b', '\blogistic regression\b']
  Machine learning fundamentals:
    category: ML
    patterns: ['\bmachine learning\b', '\bml models?\b', '\bsupervised learning\b', '\bmodel training\b']
  Deep learning:
    category: ML
    patterns: ['\bdeep learning\b', '\bneural networks?\b', '\btransformer (?:models?|architectures?)\b', '\bcnns?\b', '\brnns?\b']
  NLP:
    category: ML
    patterns: ['\bnlp\b', '\bnatural language processing\b', '\btext classification\b', '\bnamed entity recognition\b', '\bner\b']
  Fine-tuning (SFT / LoRA / PEFT):
    category: ML
    patterns: ['\bfine[- ]?tun(?:e|ing|ed)\b', '\blora\b', '\bqlora\b', '\bpeft\b', '\bsft\b', '\binstruction tuning\b']
  RLHF / DPO / RL:
    category: ML
    patterns: ['\brlhf\b', '\brlaif\b', '\bdpo\b', '\breinforcement learning\b', '\bppo\b', '\bgrpo\b']
  LLM serving / inference optimization (vLLM, TGI):
    category: ML
    patterns: ['\bvllm\b', '\btgi\b', '\btensorrt\b', '\btriton inference\b', '\bmodel serving\b', '\binference optimi[sz]ation\b', '\bquanti[sz]ation\b', '\bsglang\b', '\bllm inference\b', '\bonnx\b']
  GPU / distributed training:
    category: ML
    patterns: ['\bgpus?\b', '\bcuda\b', '\bdistributed training\b', '\bdeepspeed\b', '\bfsdp\b', '\bmegatron\b', '\btpus?\b', '\bray\b(?= ?(?:serve|train|tune|cluster|data|framework))']
  Time series / anomaly detection:
    category: ML
    patterns: ['\btime[- ]series\b', '\banomaly detection\b', '\bforecasting\b']
  Graph ML:
    category: ML
    patterns: ['\bgraph neural networks?\b', '\bgnns?\b', '\bgraph (?:ml|machine learning)\b']
  Computer vision / multimodal / speech:
    category: ML
    patterns: ['\bcomputer vision\b', '\bmulti-?modal\b', '\bspeech (?:recognition|synthesis|to text)\b', '\basr\b', '\btts\b', '\bopencv\b', '\bobject detection\b', '\bimage (?:classification|segmentation|generation)\b', '\bvision[- ]language\b']
  Feature engineering / data preprocessing:
    category: ML
    patterns: ['\bfeature engineering\b', '\bfeature stores?\b', '\bdata preprocessing\b', '\bdata labell?ing\b']
  Statistics / maths:
    category: ML
    patterns: ['\bstatistics\b', '\bstatistical\b', '\bprobability\b', '\blinear algebra\b', '\ba/b test(?:s|ing)?\b', '\bexperiment(?:ation)? design\b', '\bcausal inference\b']
  pandas / NumPy:
    category: ML
    patterns: ['\bpandas\b', '\bnumpy\b', '\bpolars\b', '\bscipy\b']

  # ---------- MLOps & platform ----------
  MLOps / LLMOps:
    category: MLOps & platform
    patterns: ['\bmlops\b', '\bllmops\b', '\bml (?:platform|infrastructure|pipelines?)\b', '\bmodel (?:deployment|monitoring|registry)\b']
  MLflow / Kubeflow / SageMaker pipelines:
    category: MLOps & platform
    patterns: ['\bmlflow\b', '\bkubeflow\b', '\bsagemaker\b', '\bvertex ai pipelines\b', '\bazure ml\b', '\bmetaflow\b', '\bzenml\b']

  # ---------- Backend ----------
  FastAPI:
    category: Backend
    patterns: ['\bfastapi\b']
  Django / Flask:
    category: Backend
    patterns: ['\bdjango\b', '\bflask\b']
  REST / API design & integration:
    category: Backend
    patterns: ['\brest(?:ful)?\b(?:\s*apis?)?(?=.{0,20}\bapis?\b)|\brestful\b', '\bapi (?:design|development|integrations?)\b', '\bgraphql\b', '\bgrpc\b', '\bopenapi\b', '\bweb ?hooks?\b']
    cs: ['\bREST\b']
  Microservices / distributed systems:
    category: Backend
    patterns: ['\bmicro-?services?\b', '\bdistributed systems?\b', '\bservice[- ]oriented\b', '\bhigh[- ]availability\b', '\bscalable (?:systems|services|backend)\b']
  Async Python (asyncio):
    category: Backend
    patterns: ['\basyncio\b', '\basync python\b', '\basynchronous programming\b', '\basync/await\b']
  Celery / background jobs:
    category: Backend
    patterns: ['\bcelery\b', '\bbackground jobs?\b', '\btask queues?\b', '\bsidekiq\b', '\bdramatiq\b']
  System design / architecture:
    category: Backend
    patterns: ['\bsystem design\b', '\bsoftware architecture\b', '\bsystems architecture\b', '\barchitect(?:ing)? (?:scalable|robust|end-to-end)\b', '\bdesign patterns\b']
  Testing (pytest, unit/integration):
    category: Backend
    patterns: ['\bpytest\b', '\bunit tests?\b', '\bintegration tests?\b', '\bunit testing\b', '\btest[- ]driven\b', '\btdd\b', '\bautomated testing\b', '\bjest\b']

  # ---------- Frontend ----------
  Full-stack / frontend:
    category: Frontend
    patterns: ['\bfull[- ]?stack\b', '\bfront[- ]?end\b', '\bhtml\b', '\bcss\b', '\btailwind\b']
  React / Next.js:
    category: Frontend
    patterns: ['\breact(?:\.?js)?\b(?! native)', '\bnext\.?js\b', '\breact native\b', '\bvue(?:\.?js)?\b', '\bangular\b', '\bsvelte\b']

  Mobile (iOS / Android):
    category: Frontend
    patterns: ['\bios\b', '\bandroid\b', '\bswift ?ui\b', '\bswift\b(?=\s*(?:,|/|\)|and\b|or\b|developer|engineer|programming))', '\breact native\b', '\bflutter\b', '\bmobile (?:apps?|development|engineer\w*)\b']

  # ---------- Security & networking ----------
  Security engineering (SIEM, AppSec, threat detection):
    category: Security & networking
    patterns: ['\bsiem\b', '\bsoar\b', '\b[ex]dr\b', '\bdevsecops\b', '\bappsec\b', '\bapplication security\b', '\bthreat (?:detection|hunting|intelligence|model(?:l?ing)?)\b',
               '\bpenetration test\w*', '\bpen ?test\w*', '\bvulnerability (?:management|scann\w*|assessments?)\b', '\bsecurity operations\b', '\bsoc analysts?\b',
               '\bzero trust\b', '\bsast\b', '\bdast\b', '\bincident response\b', '\bsplunk es\b']
  Identity & access (IAM, SSO, OAuth, RBAC):
    category: Security & networking
    patterns: ['\biam\b', '\bsso\b', '\bsingle sign[- ]on\b', '\boauth ?2?(?:\.0)?\b', '\bopenid connect\b', '\boidc\b', '\bsaml\b', '\brbac\b', '\babac\b', '\bokta\b',
               '\bactive directory\b', '\bentra id\b', '\bldap\b', '\bkeycloak\b', '\bidentity and access management\b']
  Security frameworks & certs (NIST, CISSP, ISO 27001):
    category: Security & networking
    patterns: ['\bnist\b', '\bcissp\b', '\bcism\b', '\boscp\b', '\bceh\b', '\bsecurity\+', '\bfedramp\b', '\bcmmc\b', '\bcis (?:benchmarks?|controls)\b', '\biso ?27001\b', '\bmitre att&ck\b']
  Networking (TCP/IP, DNS, load balancing):
    category: Security & networking
    patterns: ['\btcp(?:/ip)?\b', '\budp\b', '\bdns\b', '\bbgp\b', '\bvpns?\b', '\bfirewalls?\b', '\bload[- ]balanc\w+', '\bvlans?\b', '\bsd-?wan\b', '\bcdns?\b', '\bnetwork(?:ing)? protocols?\b',
               '\bip (?:networking|routing|addressing)\b', '\bcisco\b']

  # ---------- Cloud & DevOps ----------
  AWS:
    category: Cloud & DevOps
    patterns: ['\baws\b', '\bamazon web services\b', '\blambda\b(?= functions?|,|/)', '\bec2\b', '\bs3\b', '\becs\b', '\beks\b']
  AWS Bedrock:
    category: Cloud & DevOps
    patterns: ['\bbedrock\b']
  Azure (incl. Azure OpenAI):
    category: Cloud & DevOps
    patterns: ['\bazure\b']
  GCP / Vertex AI:
    category: Cloud & DevOps
    patterns: ['\bgcp\b', '\bgoogle cloud\b', '\bvertex(?: ai)?\b', '\bbigquery\b']
  Cloud (unspecified):
    category: Cloud & DevOps
    patterns: ['\bcloud (?:platforms?|infrastructure|services|native|computing|environments?)\b', '\bcloud[- ]native\b']
  Docker / containers:
    category: Cloud & DevOps
    patterns: ['\bdocker\b', '\bcontaineri[sz](?:ed|ation)\b', '\bcontainers?\b(?!\s*ship)']
  Kubernetes:
    category: Cloud & DevOps
    patterns: ['\bkubernetes\b', '\bk8s\b', '\bhelm\b', '\bopenshift\b']
  Terraform / IaC:
    category: Cloud & DevOps
    patterns: ['\bterraform\b', '\binfrastructure[- ]as[- ]code\b', '\biac\b', '\bpulumi\b', '\bcloudformation\b', '\bansible\b']
  CI/CD:
    category: Cloud & DevOps
    patterns: ['\bci ?/ ?cd\b', '\bcontinuous (?:integration|delivery|deployment)\b', '\bgithub actions\b', '\bgitlab ci\b', '\bjenkins\b', '\bcircleci\b', '\bargo ?cd\b', '\bgitops\b', '\bflux ?cd\b']
    cs: ['\bCI\b']
  Git:
    category: Cloud & DevOps
    patterns: ['\bgit\b(?!hub actions)', '\bversion control\b', '\bgitlab\b', '\bbitbucket\b']
  Linux / shell:
    category: Cloud & DevOps
    patterns: ['\blinux\b', '\bunix\b', '\bbash\b', '\bshell scripting\b']
  On-prem / air-gapped / private cloud deploy:
    category: Cloud & DevOps
    patterns: ['\bon-?prem(?:ise|ises)?\b', '\bair[- ]gapped\b', '\bprivate cloud\b', '\bself[- ]hosted\b']
  DevOps / SRE (SLOs, on-call):
    category: Cloud & DevOps
    patterns: ['\bdevops\b', '\bsre\b', '\bsite reliability\b', '\bslos?\b', '\bslis?\b', '\berror budgets?\b', '\bon[- ]call\b', '\bpost-?mortems?\b', '\bchaos engineering\b']
  Windows / PowerShell:
    category: Cloud & DevOps
    patterns: ['\bpowershell\b', '\bwindows server\b', '\bintune\b', '\bsccm\b']
  Virtualisation (VMware, Hyper-V):
    category: Cloud & DevOps
    patterns: ['\bvmware\b', '\bvsphere\b', '\besxi\b', '\bhyper-v\b', '\bproxmox\b', '\bcitrix\b', '\bvirtuali[sz]ation\b']
  Temporal / durable execution:
    category: Cloud & DevOps
    patterns: ['\btemporal(?:\.io)?\b(?= (?:workflows?|io|cloud)|,|/|\))', '\bdurable execution\b']

  # ---------- Ways of working ----------
  AI coding tools (Claude Code, Cursor, Copilot):
    category: Ways of working
    patterns: ['\bclaude code\b', '\bcursor\b(?= (?:ide|ai|editor)|,|/|\))', '\bgithub copilot\b', '\bcopilot\b', '\bai[- ](?:assisted|powered) (?:coding|development)\b', '\bai coding (?:tools|assistants?)\b', '\bwindsurf\b', '\bcodex\b']
  Low-code automation (n8n, Zapier):
    category: Ways of working
    patterns: ['\bn8n\b', '\bzapier\b', '\bmake\.com\b', '\blow[- ]code\b', '\bno[- ]code\b', '\brpa\b', '\buipath\b']
  Pre-sales / solution architecture / PoCs:
    category: Ways of working
    # Bare "PoC", "customer-facing" and "stakeholder management" appear in ordinary engineering ads.
    patterns: ['\bpre-?sales\b', '\bsolutions? architecture\b', '\bproofs? of concepts? (?:for|with) (?:customers|clients|prospects)\b', '\b(?:customer|client) pocs?\b', '\btechnical (?:discovery|demos?)\b', '\b(?:customer|client|prospect)[- ](?:demos?|workshops?)\b', '\bsales cycles?\b', '\bsolution design for (?:customers|clients)\b']

  # ---------- Soft skills ----------
  # Kept out of every tech-skill chart (aggregate.split_soft): they get their own section. Each
  # pattern needs the ask itself ("strong communication skills"), never a bare word, because
  # culture blurbs, benefits and EEO text use the same words.
  Communication:
    category: Soft skills
    patterns: ['\b(?:excellent|strong|great|exceptional|effective|clear|outstanding|good|solid|superb) (?:written,? (?:and|&) (?:verbal|oral) |(?:verbal|oral),? (?:and|&) written |written |verbal |oral |interpersonal (?:and|&) )?communications?(?: and (?:interpersonal|presentation|collaboration) )?(?: skills| abilities)?\b', '\bcommunication skills\b', '\bcommunicate (?:complex|technical|clearly|effectively)\b', '\b(?:explain|translate|articulate) (?:complex|technical|ml|ai)(?: (?:and|or) (?:complex|technical))? (?:concepts|ideas|topics|problems|trade-?offs)\b']
  Stakeholder & client-facing:
    category: Soft skills
    patterns: ['\bstakeholder (?:management|engagement)\b', '\bmanag(?:e|ing) (?:multiple )?stakeholders\b', '\b(?:customer|client)[- ]facing\b(?! (?:products?|features?|applications?|apps?|marketing|content|ai|ml|llm|systems?|services?|platforms?|tools?|websites?|surfaces?|experiences?|ui|interfaces?|software|data|agents?|solutions)\b)', '\bwork(?:ing)? (?:directly|closely|hand in hand) with (?:our )?(?:customers|clients|end users)\b', '\b(?:build|building|develop|maintain) (?:strong |trusted )?relationships with (?:customers|clients|stakeholders|partners)\b', '\btrusted (?:technical )?advisor\b']
  Ownership & autonomy:
    category: Soft skills
    patterns: ['\b(?:take|takes|taking|show|demonstrate[sd]?|high|strong|extreme|full|sense of) ownership\b', '\bself[- ](?:starter|motivated|directed|driven)\b', '\bwork(?:s|ing)? (?:independently|autonomously)\b', '\bbias (?:for|to|towards) action\b', '\bminimal (?:supervision|guidance|direction)\b']
  Collaboration:
    category: Soft skills
    patterns: ['\bteam player\b', '\bcross[- ]functional(?:ly)? (?:teams?|collaboration|partners|stakeholders|peers)\b', '\bcollaborat(?:e|es|ing|ive(?:ly)?) (?:closely |effectively |well )?(?:with|across) (?:cross[- ]functional|product|design|engineering|research|business|other|teams|stakeholders|data)\b', '\bcollaboration skills\b', '\bwork(?:s|ing)? well (?:in|with|as part of) (?:a )?teams?\b']
  Mentoring & leadership:
    category: Soft skills
    # "mentorship programme" is a benefit, so mentoring needs someone to mentor.
    patterns: ['\bmentor(?:s|ing)?,? (?:and (?:coach|grow|develop|support)(?:ing)? )?(?:junior|other|less[- ]experienced|fellow|new|team ?members|engineers|developers|the team|others|teammates|colleagues)\b', '\bcoach(?:ing)? (?:junior|engineers|developers|team ?members|others)\b', '\btechnical leadership\b', '\bleadership skills\b', '\blead(?:ing)? (?:and (?:mentor|grow)(?:ing)? )?(?:a |the )?(?:small )?team of\b']
  Comfort with ambiguity:
    category: Soft skills
    patterns: ['\b(?:ambiguity|ambiguous (?:problems|situations|environments?|requirements|spaces?))\b', '\b(?:thrive|thrives|thriving|comfortable|succeed|excel|flourish) (?:in|working in) (?:a |an )?(?:fast[- ]paced|dynamic|startup|rapidly[- ]changing|ever[- ]changing|high[- ]growth|unstructured)\b', '\bwear(?:ing)? (?:many|multiple) hats\b', '\bscrappy\b']
  Presenting & demos:
    category: Soft skills
    patterns: ['\bpresent(?:ing|s)? (?:findings |results |technical (?:concepts|content|solutions) |complex (?:ideas|topics) |ideas |work |solutions )?to (?:customers|clients|executives|leadership|stakeholders|senior|c-level|non-technical|technical and non-technical|audiences|the business)\b', '\bpresentation skills\b', '\bpublic speaking\b', '\b(?:conference )?talks? at conferences\b', '\b(?:deliver|run|lead)(?:ing)? (?:technical |product |live )?(?:demos|presentations|workshops)\b']
  Problem solving:
    category: Soft skills
    # Interview-process blurbs ("showcase your problem-solving skills") are not asks.
    not: ['\binterview', '\bassessment\b', '\bwe (?:depend|rely) on\b']
    patterns: ['\bproblem[- ]solv(?:ing|er|ers)\b', '\b(?:strong |excellent )?analytical (?:and problem[- ]solving )?(?:skills|thinking|mindset)\b', '\bcritical thinking\b', '\bfirst[- ]principles thinking\b']
  Writing & English:
    category: Soft skills
    patterns: ['\b(?:fluent|fluency|proficien(?:t|cy)|excellent|strong|good|professional|business[- ]level) (?:in |with )?(?:(?:written|spoken|verbal),? (?:and|&) (?:written|spoken|verbal) |written |spoken |business |professional )?english\b', '\benglish (?:fluency|proficiency|language skills)\b', '\bwritten english\b', '\b(?:design docs|technical writing|written communication)\b']
  Other languages (Mandarin, Japanese…):
    category: Soft skills
    patterns: ['\b(?:fluent|fluency|proficien(?:t|cy)|native|bilingual|business[- ]level|conversational|speak(?:s|ing)?|read and write) (?:in |with )?(?:english and |both english and )?(?:mandarin|chinese|cantonese|japanese|korean|bahasa(?: indonesia| melayu)?|malay|vietnamese|thai|tagalog|hindi|german|french|spanish|italian|portuguese|dutch|arabic)\b', '\b(?:mandarin|cantonese|japanese|korean|bahasa|vietnamese|thai|german|french|spanish|portuguese|arabic)(?:[- ]speaking| speakers?| language skills| proficiency| fluency| \(?jlpt)\b', '\bjlpt\b', '\bhsk ?\d\b']

  # ---------- Domain ----------
  Financial services / banking domain:
    category: Domain
    # Bare "insurance" matched every US benefits list (health, dental, life insurance).
    patterns: ['\bfinancial services\b', '\bbanking\b', '\bwealth management\b', '\binsurtech\b', '\bcapital markets\b', '\bfintech\b',
               '\binsurance (?:industry|compan(?:y|ies)|carriers?|sector|clients|customers|products|domain|technology|claims|underwriting)\b',
               '\b(?:insurers|reinsurance|underwriting)\b']
    not: ['\b(?:health|medical|dental|vision|life|disability|pet|travel) insurance\b', '\binsurance (?:coverage|plans?|benefits?|premiums?)\b']
  Payments:
    category: Domain
    patterns: ['\bpayments?\b(?= (?:systems?|infrastructure|platforms?|processing|industry|rails|domain))', '\bcard (?:issuing|acquiring|networks?)\b', '\bremittance\b', '\bcross-border payments?\b', '\bstablecoin payments?\b']
  Crypto / Web3 / blockchain:
    category: Domain
    patterns: ['\bblockchains?\b', '\bweb3\b', '\bcrypto(?:currency|currencies)?\b', '\bdefi\b', '\bon-?chain\b', '\bsmart contracts?\b', '\bsolidity\b', '\bethereum\b', '\bstablecoins?\b', '\bevm\b']
  Trading / quant / markets:
    category: Domain
    patterns: ['\bquant(?:itative)? (?:trading|research|finance|developer|analyst)\b', '\balgorithmic trading\b', '\bhigh[- ]frequency trading\b', '\bmarket[- ]making\b', '\bderivatives\b', '\border ?books?\b', '\btrading (?:systems?|strategies|platforms?)\b']
  KYC / AML / fraud:
    category: Domain
    patterns: ['\bkyc\b', '\baml\b', '\banti[- ]money laundering\b', '\bfraud (?:detection|prevention)\b', '\bfraud\b', '\bsanctions screening\b', '\btransaction monitoring\b']
  Risk modelling:
    category: Domain
    # Split from KYC/AML: quant and lending ads ask for risk models, not compliance checks.
    patterns: ['\bcredit risk\b', '\bmarket risk\b', '\brisk (?:models?|modell?ing|management|analytics)\b', '\bvar\b(?= (?:models?|calculation))', '\bvalue[- ]at[- ]risk\b']
