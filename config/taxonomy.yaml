# Skill taxonomy, one skill per specific technology (v10). Names were first taken from the census spreadsheet's
# skill_taxonomy.json so both report the same skills; the patterns here are written for full
# posting text rather than short skill lists, so they need word boundaries and context.
#
#   patterns: case-insensitive regexes
#   cs:       case-sensitive regexes (for short or ambiguous names like Go, R, MCP)
#   not:      if any of these match the same sentence, that sentence doesn't count
#   group:    the broader family a skill rolls up into on overview charts
#
# Bump `version` whenever a pattern (or any other extractor, e.g. salary) changes: stored
# postings are re-extracted on the next run.
version: 11  # v11: fewer false matches (Gemini the exchange, recruiting-fraud notices, DPO offices, 'embedding' as a verb, payment rails, non-AI guardrails and benchmarks). v10: one skill per specific technology (React, Next.js, Vue apart; each vector DB, eval tool, model provider, serving engine), each with a `group` for roll-ups. v9: security, identity, networking, DevOps/SRE, mobile, BI, Windows and virtualisation skills; bare CI, GitOps and GitLab. v2: salary from text. v3: ad length, years, unknown terms, degree, visa, equity. v4: no benefits/monitoring false positives. v5: seniority (bank grades, solutions architects), non-software engineering, pre-sales, more countries. v6: no shouted-heading words as unknown terms. v8: trading desk, ops and product roles as their own group. v7: soft skills (own section); quant roles need a quant or trading-tech title (no PMs, quantum, trading ops); risk modelling split from KYC/AML

