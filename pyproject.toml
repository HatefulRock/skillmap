[project]
name = "skillmap"
version = "0.1.0"
description = "Collects public job postings, extracts skills, and builds the aggregates behind pierreblachere.com/skills"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
]

[project.scripts]
skillmap = "skillmap.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
