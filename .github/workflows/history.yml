name: history
# Job ads from past years, out of Common Crawl's archive of Greenhouse and Lever job pages
# (skillmap/history.py). Each run backfills the half-years not done yet, newest first, within its
# time budget, and the next run carries on; once the backfill is done, a run only adds the
# half-year that just ended. Wednesdays at 02:00 Singapore time, away from the Monday refresh.
on:
  schedule:
    - cron: "0 18 * * 2"
  workflow_dispatch:
    inputs:
      budget:
        description: "Minutes of collecting before the run saves and stops"
        default: "300"

concurrency:
  # Its own group, so a long backfill never holds up (or displaces) a queued refresh. Only this
  # job writes the history files; it puts the series into skills-market.json after pulling the
  # latest one, and every refresh adds it again too.
  group: history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      # Only for the private text bucket (re-extraction after a taxonomy change); no database use.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev

      - name: Backfill from Common Crawl
        run: |
          set -o pipefail
          uv run skillmap history --budget "${{ inputs.budget || '300' }}" | tee history.txt
          { echo '```'; cat history.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: ${{ always() }}  # each finished half-year is saved as it completes; keep them even if the run fails later
        run: |
          git config user.name "skillmap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/history-ads.jsonl.gz ] || { echo "Nothing collected"; exit 0; }
          keep="$RUNNER_TEMP/history" && mkdir -p "$keep"
          cp data/history-ads.jsonl.gz data/history-state.json "$keep/"
          for attempt in 1 2 3; do
            # Start from the latest main (a refresh may have pushed meanwhile), then lay this run's files on it.
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$keep"/* data/
            uv run skillmap history --publish-only
            git add -f data/history-ads.jsonl.gz data/history-state.json data/skills-market.json
            if git diff --cached --quiet; then echo "No change"; exit 0; fi
            git commit -q -m "data: job-ad history $(date -u +%F)"
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 20))
          done
          exit 1
