name: probe
# Manual: fetch a few public URLs from a GitHub runner and print the status and the start of
# each response. Used to check a careers site's JSON before writing a collector for it.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs"
        default: ""
      post_json:
        description: "If set, POST this JSON body to each URL instead of GET (e.g. Workday job search)"
        default: ""
      script:
        description: "If set, run this repo script (scripts/NAME.py, with its arguments) instead of fetching the URLs"
        default: ""
      jq:
        description: "If set, print this jq filter of each JSON response instead of its start (e.g. '{total, n: (.results|length)}')"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        if: inputs.script != ''
      - uses: astral-sh/setup-uv@v6
        if: inputs.script != ''
      - name: Script
        if: inputs.script != ''
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          uv sync --locked --no-dev
          read -r name args <<< "$SCRIPT"
          case "$name" in *[!a-z0-9_]*) echo "bad script name"; exit 1;; esac
          uv run python "scripts/$name.py" $args
      - name: Fetch
        if: inputs.script == ''
        env:
          URLS: ${{ inputs.urls }}
          POST_JSON: ${{ inputs.post_json }}
          JQ: ${{ inputs.jq }}
          LIMIT: ${{ inputs.post_json && '300' || '2500' }}
        run: |
          for url in $URLS; do
            echo "=== $url"
            extra=()
            [ -n "$POST_JSON" ] && extra=(-X POST -H "Content-Type: application/json" --data "$POST_JSON")
            curl -sS -m 30 -A "skillmap/0.1 (+https://github.com/HatefulRock/skillmap; job-market research)" \
              -H "Accept: application/json" "${extra[@]}" -o body.txt -w "HTTP %{http_code} %{content_type}\n" "$url" || true
            if [ -n "$JQ" ]; then jq -c "$JQ" body.txt 2>&1 | head -c 4000 || true; else head -c ${LIMIT:-2500} body.txt; fi; echo
          done
