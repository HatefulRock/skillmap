name: refresh
# Weekly, Mondays at 02:00 Singapore time. Collects every source into Supabase, then publishes
# the aggregates the website reads (data/skills-market.json) and the README heatmap SVG. Skill
# demand moves over months, and postings stay up for weeks, so a weekly pass misses little.
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated: boards, adzuna, mcf, hn"
        default: "boards,adzuna,mcf,hn"
      board_limit:
        description: "Only the first N company boards (smoke test); empty for all"
        default: ""
      platforms:
        description: "Only company boards on these platforms, e.g. workday,amazon; empty for all"
        default: ""
      hn_since:
        description: "Re-read HN threads from this date (YYYY-MM-DD); empty for automatic"
        default: ""
      check_archives:
        description: "First find postings whose archived text is missing, so this run fetches it again"
        type: boolean
        default: false
      force_publish:
        description: "Publish even if the numbers changed sharply since the last publish (after checking they are real)"
        type: boolean
        default: false
      dry_run:
        description: "Collect into memory only: no database, nothing published (checks the sources)"
        type: boolean
        default: false

concurrency:
  # A dry run writes nothing, so it need not wait for (or hold up) a real run.
  group: ${{ inputs.dry_run && 'refresh-dry-run' || 'refresh' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write  # the run-health issue

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Collecting stops after 270 minutes (`--budget`), leaving time to extract, aggregate and publish
    # what was read; anything cut short is read on the next run.
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      # Supabase → Project Settings → API Keys → secret key. Posting text goes to file storage
      # with it; without it the text stays in the database.
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev

      - name: Require the database
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set the DATABASE_URL repository secret (Supabase → Connect → Session pooler URI)."
            exit 1
          fi

      - name: Collect, extract, aggregate
        env:
          # `a && '' || b` always gives b in Actions ('' is falsy), so the condition is the other way round.
          DATABASE_URL: ${{ !inputs.dry_run && secrets.DATABASE_URL || '' }}
          SUPABASE_SECRET_KEY: ${{ !inputs.dry_run && secrets.SUPABASE_SECRET_KEY || '' }}
        run: |
          set -o pipefail  # a crash must fail the step, not hide behind tee
          args=(--sources "${{ inputs.sources || 'boards,adzuna,mcf,hn' }}" --out data --readme README.md --health health.md)
          [ -n "${{ inputs.board_limit }}" ] && args+=(--board-limit "${{ inputs.board_limit }}")
          [ -n "${{ inputs.platforms }}" ] && args+=(--platforms "${{ inputs.platforms }}")
          [ -n "${{ inputs.hn_since }}" ] && args+=(--hn-since "${{ inputs.hn_since }}")
          [ "${{ inputs.force_publish }}" = "true" ] && args+=(--force-publish)
          [ "${{ inputs.check_archives }}" = "true" ] && args+=(--check-archives)
          uv run skillmap run "${args[@]}" | tee run-summary.txt
          { echo '```'; cat run-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Report run health as an issue
        # One open "run-health" issue at a time: opened or updated when the run found problems,
        # closed by the first clean run that read every source (health.ok).
        if: ${{ !inputs.dry_run }}
        run: |
          open=$(gh issue list --label run-health --state open --json number --jq '.[0].number')
          if [ -f health.md ]; then
            gh label create run-health --color d93f0b --description "Weekly refresh found broken sources" 2>/dev/null || true
            if [ -n "$open" ]; then gh issue comment "$open" --body-file health.md
            else gh issue create --title "Refresh: sources need attention" --label run-health --body-file health.md; fi
          elif [ -n "$open" ] && [ -f health.ok ]; then
            gh issue close "$open" --comment "The $(date -u +%F) refresh found no problems."
          fi

      - name: Publish live postings (metadata only) as a release asset
        if: ${{ !inputs.dry_run }}
        # Kept out of git history as well as in it: the release asset is always the latest.
        run: |
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title "Latest data" --notes "Rebuilt weekly by the refresh workflow." --latest=false
          gh release upload data-latest data/postings-live.jsonl.gz --clobber

      - name: Commit aggregates
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "skillmap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The live-postings snapshot goes into git too, for readers that can fetch git but not
          # release assets; at one commit a week the history stays small.
          git add data/skills-market.json data/skills-heatmap.svg data/digest.json data/weekly.md data/feed.xml \
            data/watchlist.json data/csv README.md
          git add -f data/postings-live.jsonl.gz
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "data: refresh $(date -u +%F)"
          git pull --rebase --quiet && git push
